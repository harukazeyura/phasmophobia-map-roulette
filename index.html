<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phasmophobia Map Roulette</title>
  <meta name="description" content="Phasmophobia のマップを条件付きでランダムに選ぶルーレット。OBS 対応。">
  <meta name="theme-color" content="#121212">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Phasmophobia Map Roulette">
  <meta property="og:description" content="Phasmophobia のマップを条件付きでランダムに選ぶルーレット。OBS 対応。">
  <!-- og:url / og:image / twitter:card はビルド時に vite.config.js で公開 URL 付きで追加する -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E">
  <script>
    // チラつき防止: Vue が読み込まれる前に、テーマとオーバーレイ用のクラスを付けておく
    // （保存キー pmr:state:v1 は src/composables/useSettings.js と同じ）
    (function () {
      var p = new URLSearchParams(location.search);
      var valid = function (t) { return t === 'light' || t === 'dark' ? t : null; };
      var theme = p.get('view') === 'overlay' ? valid(p.get('theme')) : null;
      if (!theme) {
        try { theme = valid(JSON.parse(localStorage.getItem('pmr:state:v1')).theme); } catch (e) { /* 未保存 */ }
      }
      document.documentElement.setAttribute('data-theme', theme || 'dark');
      if (p.get('view') === 'overlay') {
        var c = document.documentElement.classList;
        c.add('overlay', 'bg-' + (p.get('bg') || 'transparent'));
        if (p.get('rows') === '1') c.add('rows-1');
      }
    })();
  </script>
</head>
<body>
  <main id="app" class="app"></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
